# Produce los shorts standalone (guion.md que empieza con "Formato: short"):
# voz con edge-tts, escenas con Cloudflare Workers AI y timeline.json. Commitea
# los resultados en la misma rama. El render con Remotion se hace a mano.
#
# Las imágenes requieren los secretos del repositorio CLOUDFLARE_ACCOUNT_ID y
# CLOUDFLARE_API_TOKEN; sin ellos se genera solo la voz y el timeline.
name: Generar short

on:
  push:
    paths:
      - content/*/guion.md
      - scripts/generar_short.py
      - .github/workflows/generar-short.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-short-${{ github.ref }}

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDGE_TTS_VOICE: en-US-JennyNeural
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar voz, escenas y timeline de cada short
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Faltan los secretos de Cloudflare: se genera solo la voz y el timeline."
          fi
          for guion in content/*/guion.md; do
            grep -qiE '^formato:[[:space:]]*short' "$guion" || continue
            echo "::group::$guion"
            python scripts/generar_short.py "$guion"
            echo "::endgroup::"
          done

      - name: Commitear resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/*/audio content/*/imagenes content/*/timeline.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Generar short (voz + escenas + timeline) desde GitHub Actions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

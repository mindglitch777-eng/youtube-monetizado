name: Test Kai Studio Web

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL del sitio Netlify a probar"
        required: true
        default: "https://videosauto.netlify.app"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear si el HTML nuevo (guion simplificado) ya está desplegado
        run: |
          curl -s "${{ github.event.inputs.site_url }}/?nocache=$(date +%s)" -o index.html
          if grep -q "la cantidad de imágenes de cada línea se calcula sola" index.html; then
            echo "DEPLOYADO: sí, el index.html nuevo ya está en línea"
          else
            echo "DEPLOYADO: NO, todavía sirve una versión vieja del index.html"
          fi

      - name: preview-script (guion simplificado, texto plano sin pipes)
        run: |
          node -e '
            const fs = require("fs");
            const texto = "Alguien te dice algo lindo a los tres días? Eso no es amor.\nEstas son las cinco señales.\nComenta tu número. | | FINAL";
            fs.writeFileSync("req-preview.json", JSON.stringify({ slug: "prueba-test-upload", voice: "es-MX-JorgeNeural", rate: "+40%", texto }));
          '
          curl -s -X POST "${{ github.event.inputs.site_url }}/.netlify/functions/preview-script" \
            -H "Content-Type: application/json" \
            --data-binary @req-preview.json \
            -w "\nHTTP %{http_code}\n"

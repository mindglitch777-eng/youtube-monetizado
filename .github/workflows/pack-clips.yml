# Paso 4 de un PACK de video largo: descarga los clips reales de Pexels
# listados en assets.json. Corre en GitHub Actions porque videos.pexels.com
# no es accesible desde el entorno de Claude Code.
name: Pack — clips

on:
  push:
    paths:
      - content/*/assets.json
      - scripts/pack_clips.py
      - .github/workflows/pack-clips.yml
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpeta del pack (ej. content/2026-XX-XX-he-never-raised-his-voice)"
        required: false

permissions:
  contents: write

concurrency:
  group: pack-clips-${{ github.ref }}

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Descargar clips de cada pack (carpetas con assets.json + shots.json)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.carpeta }}" ]; then
            python scripts/pack_clips.py "${{ github.event.inputs.carpeta }}"
          else
            for carpeta in content/*/; do
              [ -f "$carpeta/assets.json" ] && [ -f "$carpeta/shots.json" ] || continue
              echo "::group::$carpeta"
              python scripts/pack_clips.py "$carpeta"
              echo "::endgroup::"
            done
          fi

      - name: Commitear clips
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Pack: descargar clips (Pexels) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

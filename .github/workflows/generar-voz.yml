# Genera la narración (edge-tts) de cada video en content/ y commitea los audios
# y timeline.json en la misma rama. Corre en GitHub Actions porque Microsoft
# bloquea edge-tts desde el entorno de Claude Code. Solo regenera las secciones
# cuyo texto cambió en el guion.
name: Generar voz

on:
  push:
    paths:
      - content/*/guion.md
      - scripts/generar_audio.py
      - scripts/segmentos.py
      - .github/workflows/generar-voz.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-voz-${{ github.ref }}

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar audio de cada guion
        env:
          EDGE_TTS_VOICE: en-US-JennyNeural
        run: |
          set -euo pipefail
          for guion in content/*/guion.md; do
            case "$guion" in content/_template/*) continue ;; esac
            # Los shorts standalone los procesa generar-short.yml.
            grep -qiE '^formato:[[:space:]]*short' "$guion" && continue
            echo "::group::$guion"
            python scripts/generar_audio.py "$guion"
            echo "::endgroup::"
          done

      - name: Commitear audios y timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/*/audio content/*/timeline.json
          if git diff --cached --quiet; then
            echo "Sin cambios de audio."
            exit 0
          fi
          git commit -m "Generar voz (edge-tts) desde GitHub Actions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Transcripciones de videos de referencia

# Baja SOLO los subtítulos (manuales o automáticos) de los videos listados
# en research/transcribir.txt, sin bajar el video. Corre en GitHub Actions
# porque el sandbox de Claude tiene YouTube bloqueado. El texto queda como
# artifact y también se imprime en el log.

on:
  workflow_dispatch:
  push:
    paths:
      - research/transcribir.txt

jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -U yt-dlp
      - name: Bajar subtítulos
        run: |
          mkdir -p out
          grep -v '^#' research/transcribir.txt | while read -r id lang; do
            [ -z "$id" ] && continue
            for client in default android tv_simply web_safari; do
              if yt-dlp --skip-download --write-subs --write-auto-subs \
                   --sub-langs "${lang}-orig,${lang},${lang}.*" --sub-format vtt \
                   --extractor-args "youtube:player_client=${client}" \
                   -o "out/%(id)s" "https://www.youtube.com/watch?v=${id}" >/dev/null 2>out/${id}.err \
                 && ls out/${id}*.vtt >/dev/null 2>&1; then
                echo "OK ${id} (${client})"; break
              fi
            done
            ls out/${id}*.vtt >/dev/null 2>&1 || { echo "FALLO ${id}"; tail -2 out/${id}.err; }
          done
      - name: Pasar VTT a texto con tiempos
        run: |
          python3 - <<'EOF'
          import re, glob, pathlib
          for f in sorted(glob.glob("out/*.vtt")):
              lines, last = [], None
              ts = None
              for raw in pathlib.Path(f).read_text(encoding="utf-8").splitlines():
                  m = re.match(r"(\d\d):(\d\d):(\d\d)\.\d+ -->", raw)
                  if m:
                      ts = int(m[1]) * 3600 + int(m[2]) * 60 + int(m[3]); continue
                  t = re.sub(r"<[^>]+>", "", raw).strip()
                  if not t or t == last or raw.startswith(("WEBVTT", "Kind:", "Language:")):
                      continue
                  lines.append(f"[{ts//60:02d}:{ts%60:02d}] {t}"); last = t
              out = pathlib.Path(f).with_suffix(".txt")
              out.write_text("\n".join(lines), encoding="utf-8")
              print(f"===== {out.name} ({len(lines)} líneas) =====")
              print("\n".join(lines))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcripciones
          path: out/

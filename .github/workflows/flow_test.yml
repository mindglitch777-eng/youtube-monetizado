name: Flow · prueba del script (Chromium y Firefox)

# Prueba flow_pijama.user.js contra una copia de la caja de Flow hecha con un editor
# ProseMirror real (el mismo que usa Flow), en Chromium y en Firefox.

on:
  workflow_dispatch:
  push:
    paths:
      - video3/tools/flow_pijama.user.js
      - video3/tools/test_flow/**

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Editor ProseMirror y navegadores
        run: |
          cd video3/tools/test_flow
          npm init -y >/dev/null
          npm install --silent prosemirror-state prosemirror-view prosemirror-model prosemirror-schema-basic prosemirror-keymap prosemirror-commands esbuild playwright
          npx esbuild editor_falso.js --bundle --format=iife --outfile=editor.bundle.js --log-level=warning
          npx playwright install --with-deps chromium firefox
      - name: Probar
        run: NODE_PATH=video3/tools/test_flow/node_modules node video3/tools/test_flow/probar.js

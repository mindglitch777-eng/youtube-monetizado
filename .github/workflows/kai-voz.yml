# Paso 1 de un video de la línea Kai (carpetas content-kai/*/ con guion.txt +
# shots.json, formato "Top 5" — RULES.md, sección Kai): sintetiza el guion
# completo con edge-tts en una sola pasada (a diferencia del PACK
# cinematográfico, acá no hay capítulos separados). Corre en GitHub Actions
# porque Microsoft bloquea edge-tts desde el entorno de Claude Code.
name: Kai — voz

on:
  push:
    paths:
      - content-kai/*/guion.txt
      - scripts/kai_voz.py
      - .github/workflows/kai-voz.yml
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpeta del video Kai (ej. content-kai/2026-XX-XX-top5-red-flags)"
        required: false

permissions:
  contents: write

concurrency:
  group: kai-voz-${{ github.ref }}

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar voz de cada video Kai (carpetas con guion.txt + shots.json)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.carpeta }}" ]; then
            python scripts/kai_voz.py "${{ github.event.inputs.carpeta }}"
          else
            for carpeta in content-kai/*/; do
              [ -f "$carpeta/guion.txt" ] && [ -f "$carpeta/shots.json" ] || continue
              echo "::group::$carpeta"
              python scripts/kai_voz.py "$carpeta"
              echo "::endgroup::"
            done
          fi

      - name: Commitear audio de voz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content-kai
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Kai: generar voz (edge-tts) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

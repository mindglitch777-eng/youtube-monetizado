# Descarga los sonidos de marca de Mixkit listados en assets/sonido/fuentes.tsv
# y los commitea en la misma rama. Solo baja los que todavía no existen.
name: Descargar sonidos de marca

on:
  push:
    paths:
      - assets/sonido/fuentes.tsv
      - assets/musica/fuente.txt
      - .github/workflows/descargar-sonidos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y verificar
        run: |
          set -euo pipefail
          cd assets/sonido
          grep -v '^#' fuentes.tsv | while IFS=$'\t' read -r archivo id slug uso; do
            [ -z "$archivo" ] && continue
            if [ -f "$archivo" ]; then
              echo "✓ $archivo ya existe"
              continue
            fi
            ok=""
            for url in \
              "https://assets.mixkit.co/active_storage/sfx/${id}/${id}-preview.mp3" \
              "https://assets.mixkit.co/sfx/preview/mixkit-${slug}-${id}.mp3"; do
              if curl -fsSL -A "Mozilla/5.0" -o "$archivo" "$url" \
                 && file -b --mime-type "$archivo" | grep -qE '^audio/'; then
                echo "✓ $archivo ← $url ($(stat -c%s "$archivo") bytes)"
                ok=1
                break
              fi
              rm -f "$archivo"
            done
            if [ -z "$ok" ]; then
              echo "✗ No se pudo descargar $archivo (Mixkit ${id}: ${slug})"
              exit 1
            fi
          done

      - name: Descargar música de fondo
        run: |
          set -euo pipefail
          mkdir -p assets/musica
          cd assets/musica
          if [ -f fondo.mp3 ]; then
            echo "✓ fondo.mp3 ya existe"
            exit 0
          fi
          # fuente.txt: página de Mixkit de donde se toma la primera pista.
          pagina=$(grep -v '^#' fuente.txt | grep -v '^[[:space:]]*$' | head -1)
          curl -fsSL -A "Mozilla/5.0" "$pagina" -o pagina.html
          url=$(grep -oE 'https://assets\.mixkit\.co/music/[^"]+\.mp3' pagina.html | head -1 || true)
          rm -f pagina.html
          if [ -z "$url" ]; then
            echo "✗ No encontré ninguna pista en $pagina"
            exit 1
          fi
          curl -fsSL -A "Mozilla/5.0" -o fondo.mp3 "$url"
          file -b --mime-type fondo.mp3 | grep -qE '^audio/' || { echo "✗ $url no es audio"; rm -f fondo.mp3; exit 1; }
          echo "$url" > origen.txt
          echo "✓ fondo.mp3 ← $url ($(stat -c%s fondo.mp3) bytes)"

      - name: Commitear los sonidos nuevos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/sonido assets/musica
          if git diff --cached --quiet; then
            echo "No hay sonidos nuevos."
          else
            git commit -m "Descargar sonidos de marca desde Mixkit"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

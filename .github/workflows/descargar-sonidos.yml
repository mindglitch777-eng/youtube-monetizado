# Descarga los sonidos de marca de Mixkit listados en assets/sonido/fuentes.tsv
# y los commitea en la misma rama. Solo baja los que todavía no existen.
name: Descargar sonidos de marca

on:
  push:
    paths:
      - assets/sonido/fuentes.tsv
      - .github/workflows/descargar-sonidos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y verificar
        run: |
          set -euo pipefail
          cd assets/sonido
          grep -v '^#' fuentes.tsv | while IFS=$'\t' read -r archivo id slug uso; do
            [ -z "$archivo" ] && continue
            if [ -f "$archivo" ]; then
              echo "✓ $archivo ya existe"
              continue
            fi
            ok=""
            for url in \
              "https://assets.mixkit.co/active_storage/sfx/${id}/${id}-preview.mp3" \
              "https://assets.mixkit.co/sfx/preview/mixkit-${slug}-${id}.mp3"; do
              if curl -fsSL -A "Mozilla/5.0" -o "$archivo" "$url" \
                 && file -b --mime-type "$archivo" | grep -qE '^audio/'; then
                echo "✓ $archivo ← $url ($(stat -c%s "$archivo") bytes)"
                ok=1
                break
              fi
              rm -f "$archivo"
            done
            if [ -z "$ok" ]; then
              echo "✗ No se pudo descargar $archivo (Mixkit ${id}: ${slug})"
              exit 1
            fi
          done

      - name: Commitear los sonidos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sonido/*.mp3
          if git diff --cached --quiet; then
            echo "No hay sonidos nuevos."
          else
            git commit -m "Descargar sonidos de marca desde Mixkit"
            git push
          fi

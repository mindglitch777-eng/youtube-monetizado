# Paso 2/3 de un PACK de video largo: genera las imágenes IA de shots.json
# con Cloudflare Workers AI. Corre en GitHub Actions porque Cloudflare no es
# accesible desde el entorno de Claude Code.
#
# Se dispara escribiendo "test" o "full" en content/<pack>/PEDIDO_IMAGENES.txt
# y pusheando (mismo patrón que imagenes/pedido.txt del resto del canal) —
# workflow_dispatch no sirve acá porque el archivo del workflow todavía no
# existe en la rama por defecto del repo. El paso final borra el pedido
# para que la próxima corrida (test o full) se dispare con un push nuevo.
name: Pack — imágenes

on:
  push:
    paths:
      - content/*/PEDIDO_IMAGENES.txt
      - scripts/pack_imagenes.py
      - .github/workflows/pack-imagenes.yml

permissions:
  contents: write

concurrency:
  group: pack-imagenes-${{ github.ref }}

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar git (para los checkpoints durante la generación)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar imágenes (test o lote completo, según el pedido)
        run: |
          set -euo pipefail
          for pedido in content/*/PEDIDO_IMAGENES.txt; do
            [ -f "$pedido" ] || continue
            carpeta=$(dirname "$pedido")
            modo=$(tr -d '[:space:]' < "$pedido")
            echo "::group::$carpeta ($modo)"
            if [ "$modo" = "test" ]; then
              python scripts/pack_imagenes.py "$carpeta" --solo-test
            else
              python scripts/pack_imagenes.py "$carpeta"
            fi
            echo "::endgroup::"
            rm -f "$pedido"
          done

      - name: Commitear resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Pack: generar imágenes desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

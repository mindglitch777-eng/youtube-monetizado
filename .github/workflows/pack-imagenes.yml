# Paso 2/3 de un PACK de video largo: genera las imágenes IA de shots.json
# con Cloudflare Workers AI. Corre en GitHub Actions porque Cloudflare no es
# accesible desde el entorno de Claude Code. Se dispara solo a mano
# (workflow_dispatch) para poder correr primero el lote de prueba de 3 y
# revisarlo antes del lote completo.
name: Pack — imágenes

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpeta del pack (ej. content/2026-XX-XX-he-never-raised-his-voice)"
        required: true
      modo:
        description: "test (solo las 3 marcadas test_batch) o full (el resto + miniaturas)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full

permissions:
  contents: write

concurrency:
  group: pack-imagenes-${{ github.ref }}

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar git (para los checkpoints durante la generación)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar imágenes (test o lote completo)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.modo }}" = "test" ]; then
            python scripts/pack_imagenes.py "${{ github.event.inputs.carpeta }}" --solo-test
          else
            python scripts/pack_imagenes.py "${{ github.event.inputs.carpeta }}"
          fi

      - name: Commitear resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Pack: generar imágenes (${{ github.event.inputs.modo }}) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

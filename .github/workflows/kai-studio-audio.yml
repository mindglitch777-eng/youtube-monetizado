# Voz de kai-studio (organizador + editor genérico de Shorts Kai): corre
# tools/make_audio.py para cada episodio/idioma que tenga script.json pero
# todavía no tenga timing.json. Edge-TTS está bloqueado desde el entorno
# de Claude Code — por eso esto corre en GitHub Actions.
name: Kai studio — voz

on:
  push:
    paths:
      - kai-studio/episodes/*/*/script.json
      - kai-studio/tools/make_audio.py
      - .github/workflows/kai-studio-audio.yml
  workflow_dispatch:
    inputs:
      slug:
        description: "Episodio (ej. love-bombing)"
        required: false
      lang:
        description: "Idioma (en/es)"
        required: false
      voice:
        description: "Voz edge-tts (opcional, si no usa la del script.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: kai-studio-audio-${{ github.ref }}

jobs:
  voz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar edge-tts y ffmpeg
        run: |
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generar voz de cada episodio/idioma sin timing.json
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS=(python tools/make_audio.py "${{ github.event.inputs.slug }}" "${{ github.event.inputs.lang }}")
            [ -n "${{ github.event.inputs.voice }}" ] && ARGS+=(--voice "${{ github.event.inputs.voice }}")
            "${ARGS[@]}"
          else
            for script in episodes/*/*/script.json; do
              slug=$(basename "$(dirname "$(dirname "$script")")")
              lang=$(basename "$(dirname "$script")")
              timing="public/episodes/$slug/$lang/timing.json"
              if [ -f "$timing" ]; then
                echo "✓ $timing ya existe, salteo $slug/$lang"
                continue
              fi
              echo "::group::$slug/$lang"
              python tools/make_audio.py "$slug" "$lang"
              echo "::endgroup::"
            done
          fi

      - name: Commitear voz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/episodes
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Kai studio: generar voz (edge-tts) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

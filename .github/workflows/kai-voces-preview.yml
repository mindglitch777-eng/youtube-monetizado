# Prueba de 2-3 voces edge-tts sobre una sola línea de muestra, para elegir
# la voz de un video Kai antes de sintetizar el guion completo (paso 2 de
# las instrucciones por video). Corre en GitHub Actions porque Microsoft
# bloquea edge-tts desde el entorno de Claude Code (igual que kai-voz.yml).
#
# workflow_dispatch no sirve acá porque la API lo exige en la rama por
# defecto — se dispara con un push a un archivo preview_request.json
# (texto/carpeta/voces) dentro de cada carpeta content-kai/*/audio/.
name: Kai — preview de voces

on:
  push:
    paths:
      - content-kai/*/audio/preview_request.json
      - scripts/kai_voces_preview.py
      - .github/workflows/kai-voces-preview.yml

permissions:
  contents: write

concurrency:
  group: kai-voces-preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sintetizar preview con cada voz
        run: python scripts/kai_voces_preview_runner.py

      - name: Commitear preview de audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content-kai
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Kai: preview de voces (edge-tts) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

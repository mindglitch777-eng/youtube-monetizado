# Voz de content-kai/parte1-love-bombing (una línea por mp3, boundary de
# palabra para subtítulos). Corre en GitHub Actions porque Microsoft
# bloquea edge-tts desde el entorno de Claude Code.
name: Kai P1 — voz

on:
  push:
    paths:
      - content-kai/parte1-love-bombing/script.json
      - scripts/kai_p1_voz.py
      - .github/workflows/kai-p1-voz.yml

permissions:
  contents: write

concurrency:
  group: kai-p1-voz-${{ github.ref }}

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sintetizar voz (una línea por mp3, en-US-AndrewNeural)
        run: python scripts/kai_p1_voz.py content-kai/parte1-love-bombing en-US-AndrewNeural "+8%"

      - name: Commitear audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content-kai/parte1-love-bombing/audio
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Kai P1: generar voz por línea (edge-tts) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

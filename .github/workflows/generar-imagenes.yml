# Genera las escenas con Cloudflare Workers AI (flux-1-schnell) para cada video
# que tenga content/<video>/imagenes/pedido.txt, actualiza timeline.json y
# commitea todo en la misma rama. Corre en GitHub Actions porque Cloudflare no
# es accesible desde el entorno de Claude Code. Las imágenes que ya existen no
# se regeneran.
#
# Cada imagen se commitea y pushea apenas se genera (scripts/segmentos.py,
# función checkpoint), no solo al final: si el workflow se corta a mitad de
# camino (timeout, corte de red, error de un modelo), lo ya generado queda
# guardado en la rama y la próxima corrida arranca justo donde quedó, sin
# volver a pagar ni regenerar nada. El paso "Commitear" del final es solo un
# respaldo por si algo quedó sin subir.
#
# Requiere los secretos del repositorio CLOUDFLARE_ACCOUNT_ID y
# CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
name: Generar imágenes

on:
  push:
    paths:
      - content/*/imagenes/pedido.txt
      - .github/workflows/generar-imagenes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-imagenes-${{ github.ref }}

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      EDGE_TTS_VOICE: en-US-GuyNeural
    steps:
      - name: Verificar secretos
        id: secretos
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN; no se generan imágenes."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secretos.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.secretos.outputs.ok == 'true'
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.secretos.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Configurar git (para los checkpoints durante la generación)
        if: steps.secretos.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar imágenes pedidas (y actualizar timeline.json)
        if: steps.secretos.outputs.ok == 'true'
        run: |
          set -euo pipefail
          for pedido in content/*/imagenes/pedido.txt; do
            [ -f "$pedido" ] || continue
            video=$(dirname "$(dirname "$pedido")")
            opciones=$(grep -v '^#' "$pedido" | grep -v '^[[:space:]]*$' | head -1 || true)
            echo "::group::$video $opciones"
            python scripts/generar_imagenes.py "$video/guion.md" $opciones
            echo "::endgroup::"
          done

      # Respaldo: los checkpoints de arriba ya van subiendo cada imagen; esto
      # corre siempre (incluso si el paso anterior falló) para no dejar nada sin subir.
      - name: Commitear lo que haya quedado sin subir
        if: always() && steps.secretos.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Generar imágenes (Cloudflare Workers AI) desde GitHub Actions"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

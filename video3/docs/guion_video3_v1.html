const MD="# VIDEO 3 · \"Sobreviví 30 días a la peste negra (en pijama)\"\n\nGuion v1 · Explicado en Pijamas · narración en segunda persona (\"tú\")\nIdea aprobada por la IA de YouTube a partir de la matriz de viralidad (idea 1, 92/100). Formato \"Día 1 al Día 30\", el más rápido del barrido del 26/10/2026, todavía sin ninguna versión histórica.\n\nDuración calculada: 1.657 palabras de voz a 185 por minuto (la velocidad real del video 2, con la voz al +16 % y sin silencios) ≈ 9:00. Pasa los 8 minutos, así que se pueden poner anuncios en el medio.\n\n---\n\n## A. QUÉ TOMAMOS DEL BRIEF DE LA IA DE YOUTUBE (y qué cambiamos)\n\n| Pedido del brief | Qué hacemos | Por qué |\n|---|---|---|\n| HUD permanente: contador de días arriba a la izquierda | **Sí.** \"DÍA 7 / 30\" con salto de número y sacudida en cada cambio | Es el motor del formato: progreso visible todo el tiempo |\n| Barra de vidas, infección (0–100 %) y aura arriba a la derecha | **Sí.** 3 corazones, barra verde → roja y aura | Es lo mismo que en el video 2 más la barra de infección, que da tensión |\n| Tarjeta de decisión estilo RPG cada 60–90 s | **Sí, 5 decisiones** (una cada ~90 s). Opciones A/B y cuenta regresiva del Despertador | Los comentarios suben cuando el espectador elige. Ojo: **sin silencios**: la cuenta \"tres, dos, uno\" la dice el Despertador sobre un tic |\n| Cero cuadros quietos (nada parado más de 0,5 s) | **Sí, con ajuste:** la cámara nunca se detiene (pan y zoom siempre en movimiento) y hay un cambio fuerte cada 1,5–3 s | Con 0,5 s de corte haría falta el doble de imágenes. El movimiento continuo consigue lo mismo |\n| Sacudida de cámara en pérdidas de vida y sustos | **Sí**, 8–12 cuadros | Ya lo tenemos (PUNCH/SMASH); se agrega la sacudida |\n| Partículas encima de la imagen: polvo, ceniza, moscas | **Sí, nuevo.** Polvo y moscas en la ciudad, lluvia en la huida, brasas en la escena de las hogueras | Le da vida a las imágenes fijas sin generar más |\n| Subtítulos de 1 a 3 palabras resaltadas (en rojo, peligro; en amarillo, tiempo) | **En los Shorts sí** (ya los tenemos palabra por palabra) y **se agrega el color por tipo de palabra**. En el largo, solo los carteles | Los largos sin subtítulos quemados funcionaron bien en los videos 1 y 2 |\n| Whisper para sincronizar subtítulos | **No hace falta.** edge-tts ya devuelve el tiempo exacto de cada palabra | Un paso menos y sin errores de transcripción |\n| Ducking de 6 dB en la música | **Sí**, pasamos de 4 a 6 dB | Voz más al frente |\n| Voz a −14 LUFS con compresión | Ya lo hacemos (−14 LUFS, pico −1 dBTP) | — |\n| Un solo componente con modo largo y modo Short | Ya funciona así (V2Largo / V2Short). Para el video 3 se generaliza en V3 | — |\n| \"Retención de más del 60 % en el primer minuto\" | Es la meta, **no una garantía** | Depende del gancho y de la miniatura, no solo del código |\n| Médico con máscara de pájaro | **Sí, como chiste:** \"Este disfraz todavía no existe: llega en 300 años\" | La máscara es del siglo XVII. Usarla en serio sería un error que los comentarios marcarían |\n\n---\n\n## B. REGLAS DEL JUEGO (en pantalla)\n\n- **Contador:** DÍA N / 30. Es el centro del video.\n- **Vidas:** ❤❤❤. Pijama pierde una el día 11 (la pulga) y otra el día 17 (la fiebre). Llega al final con una sola: hay tensión hasta el último minuto.\n- **Infección:** barra de 0 a 100 %. Sube con los errores y baja con las buenas decisiones.\n- **Aura:** como en el video 2. Al final da **+1.348** (chiste con el año).\n- **Decisiones (5):** tarjeta A / B. El Despertador cuenta \"tres, dos, uno\" sobre un tic. Pijama siempre elige la que lo deja vivo, y el narrador explica por qué la otra mataba.\n- **Tabla final:** las 5 decisiones con ✓ y ✗, y la pregunta \"¿cuántas acertaste tú?\" para los comentarios.\n- **El Despertador (🕰):** la misma voz y el mismo filtro que en el video 2. Ahora es compañero de equipo desde el principio (\"revancha\").\n- **Continuidad con el video 2:** \"La última vez duraste 11 días\". Premia a quien vio el video 2 y es una revancha que se entiende sola.\n\n**Tono:** gracioso con Pijama y el Despertador. **Serio con las víctimas reales** (los días 12 a 17, sin chistes). No hay sangre ni imágenes de cuerpos: las fosas se ven de lejos, como siluetas o con sábanas blancas. Se cuida a los anunciantes.\n\nLíneas con **🕰** = voz del Despertador. Líneas con **✂** = se sacan en el Short. `{…}` = cambio en el HUD en esa línea.\n\n---\n\n## C. EL GUION\n\n### GANCHO · TRÁILER\n*Es el Short 0. HUD: DÍA 1/30 · ❤❤❤ · INF 0 % · AURA 0. Callejón de Florencia al amanecer.*\n\nFlorencia. Abril de 1348. Día uno.\nAbres los ojos en un callejón. Descalzo. En pijama. Otra vez.\n🕰 «¿Te acuerdas de la peste negra? Duraste once días.»\n🕰 «Revancha. Dificultad: realista.»\nEsta vez no tienes que llegar lejos. Tienes que llegar al día treinta.\nTres vidas. Una barra de infección. Y cada tanto, una decisión.\nTú eliges. Yo te digo si sobrevives.\nEn los próximos meses, en esta ciudad, va a morir más o menos la mitad de la gente.\nMira a la persona que tengas al lado. Uno de los dos… no llega al verano.\n🕰 «Treinta días. Empieza… ya.» {el contador arranca}\n\n---\n\n### DÍAS 1–3 · LAS REGLAS\n*[SHORT 1] HUD: DÍA 1→3. Ciudad viva, mercado, colores cálidos que todavía no se apagaron.*\n\nDía uno. Tu primer enemigo no es la peste. Es el hambre.\n⚑ Pijama tiene treinta días para sobrevivir a la peste negra. En pijama.\nFlorencia tiene unas cien mil personas. Es una de las ciudades más ricas de Europa.\nBancos, telas de lana, y una catedral gigante a medio construir.\nLa cúpula todavía no existe. Faltan casi cien años.\n✂ Nadie te mira raro por el pijama. Porque nadie mira a nadie a los ojos.\nEn el mercado hay rumores. Que a Sicilia llegaron barcos con la tripulación muerta.\nQue en Pisa ya empezó.\n🕰 «Spoiler: acá también.»\nTienes sed. Y el agua del río… no. Eso ya lo aprendiste en Londres.\nAcá casi todos toman vino aguado o cerveza. Hasta los chicos. Porque el agua te puede matar.\nEn una taberna te dan vino aguado a cambio de un botón del pijama.\n🕰 «Primer trueque. Aura: más diez.» {AURA +10}\n✂ Día dos. Duermes en un portal. Te despierta un perro. Te persigue un panadero.\nDía tres. Cae la noche. Y llega la primera decisión. {DECISIÓN 1}\n**Tarjeta: A) Dormir en una posada barata, llena de gente · B) Dormir solo en un establo**\nA: una posada barata, con fuego y llena de gente. B: un establo, solo, con los caballos. Elige.\n🕰 «Tres. Dos. Uno.»\nLa posada parece mejor. Techo, fuego, una cama de paja.\nPero son veinte personas en un cuarto. Y cada colchón es un hotel de pulgas.\nEl establo tampoco es un spa. Pero ahí estás solo. Y en una peste, estar solo es estar a salvo.\nPijama elige el establo. {INF 5 %}\n🕰 «Buena. Huele a caballo, pero buena.»\n\n---\n\n### DÍAS 4–7 · LOS PRIMEROS\n*[SHORT 2] HUD: DÍA 4→7. Calle angosta, ventanas que se cierran, la paleta empieza a enfriarse.*\n\nDía cuatro. Un vecino de la calle no abre la ventana.\nDía cinco. Abren su puerta. Y lo sacan envuelto en una sábana.\n⚑ Pijama tiene que sobrevivir treinta días a la peste negra. Va por el quinto.\nAsí empieza. Fiebre. Escalofríos. Dolor de cabeza. Como una gripe.\nPero no es una gripe.\nDespués aparece un bulto, del tamaño de un huevo, en la axila o en la ingle.\nSe llama bubón. Por eso le dicen peste bubónica.\nY en tres a siete días… casi siempre se termina.\nHay una versión peor: cuando llega a los pulmones. Se contagia tosiendo. Y no tarda una semana. Tarda uno o dos días.\n🕰 «Tranquilo. Eso no te va a pasar.»\n🕰 «…Probablemente.»\nLo que nadie sabe en 1348 es quién la trae.\nNo son los vecinos. Son las pulgas. Viajan en las ratas, en la ropa, en las telas que vende esta ciudad.\n✂ Nadie acá sabe lo que es un germen. Faltan más de quinientos años para que alguien lo descubra.\nDía seis. La familia del vecino golpea tu establo. Piden ayuda. {DECISIÓN 2}\n**Tarjeta: A) Entrar a su casa a ayudar · B) Dejarles pan en la puerta, sin entrar**\nA: entras a su casa a ayudar. B: les dejas pan en la puerta, sin entrar. Elige.\n🕰 «Tres. Dos. Uno.»\nEsta es la más difícil del juego. Lo correcto y lo seguro no siempre son lo mismo.\nSi entras, entras al cuarto de las pulgas.\nPijama deja pan en la puerta. Golpea dos veces. Y se va.\nDesde la ventana, una nena le dice gracias.\n🕰 «Ayudaste y sigues vivo. Aura: más cien.» {AURA +100}\nDía siete. Ya no es un vecino. Es la calle entera. {INF 15 %}\n\n---\n\n### DÍAS 8–11 · EL MÉDICO\n*[SHORT 3] HUD: DÍA 8→11. Interior del médico con frascos, hierbas y un esqueleto. Tono de comedia.*\n\nDía ocho. Te pica la pierna. Te pica mucho.\n🕰 «No. No, no, no.»\n⚑ Pijama va por el día ocho de treinta. Y le pica algo.\nVas a ver a un médico. Esperas al tipo con máscara de pájaro.\n🕰 «Ese disfraz todavía no existe. Lo inventan en trescientos años. Llegaste temprano.»\nEl médico de 1348 tiene otra teoría: la culpa es del aire podrido. Y de los planetas.\nLiteral. Los médicos más famosos de París escribieron que todo empezó por Saturno, Júpiter y Marte, juntos en el cielo.\n✂ 🕰 «Bro le echó la culpa a Saturno.»\nLos remedios: oler flores y hierbas. Lavarte con vinagre. No dormir de día. Y sacarte sangre.\nAlgunos caminan con una naranja llena de clavos de olor pegada a la nariz.\n🕰 «Desodorante de ambiente, versión 1348.»\nAl papa le recomendaron sentarse todo el día entre dos hogueras enormes.\n🕰 «Y sobrevivió. Pero de casualidad: a las pulgas no les gusta el calor.»\nDía nueve. El médico te ofrece la cura. {DECISIÓN 3}\n**Tarjeta: A) Una sangría · B) Un ramo de hierbas y vinagre**\nA: te saca sangre con una cuchilla, para \"equilibrar el cuerpo\". B: te da un ramo de hierbas y una botella de vinagre. Elige.\n🕰 «Tres. Dos. Uno.»\nLa sangría te deja pálido, débil y con menos defensas. Cuando más las necesitas.\nLas hierbas y el vinagre no curan nada. Pero tampoco hacen daño.\nPijama elige el vinagre. Huele a ensalada. Pero sigue entero.\nDía diez. Lo de la pierna era una pulga. Una sola. Del tamaño de una semilla de sésamo.\nDía once. Te sube la temperatura. {INF 30 %} {VIDA −1}\n🕰 «Pierdes una vida. Te quedan dos. Día once: igual que la última vez. Ahora no.»\n\n---\n\n### DÍAS 12–17 · LA CIUDAD SE APAGA\n*[SHORT 4] HUD: DÍA 12→17. Sin chistes. Colores casi grises, campanario quieto, fosas de lejos con sábanas blancas. Música baja, sin efectos graciosos.*\n\nDía doce. Las campanas dejaron de sonar.\nAntes tocaban por cada muerto. Ahora las prohibieron. Eran tantas que asustaban a la ciudad.\n⚑ Pijama lleva doce días en Florencia, en 1348. Y la ciudad se está apagando.\nYa no hay entierros de uno en uno. Hay fosas grandes. Y se llenan por capas.\nLos que tienen dinero cierran sus casas y se van. Muchos médicos se van. Los que se quedan son los que no tienen adónde ir.\nEn Siena, a cincuenta kilómetros, un hombre llamado Agnolo di Tura escribió que enterró a sus cinco hijos con sus propias manos.\nY que nadie lloraba. Porque todos esperaban morir.\nAcá no hay chiste.\nDía quince. Fiebre. De la fuerte. {INF 60 %} *(sacudida de cámara)*\n🕰 «Ok. Ahora sí, no es broma.»\nPijama se tapa con paja en el establo. Tiembla. Dos días.\nNo come. Toma vino aguado. Y se revisa las axilas cada hora.\nDía diecisiete. La fiebre baja. Y no hay ningún bulto.\n🕰 «Era fiebre de frío, de miedo y de dormir en un establo. Pero el cuerpo lo pagó.» {VIDA −1}\n🕰 «Te queda una vida. Una.»\n\n---\n\n### DÍAS 18–21 · LA HUIDA\n*[SHORT 5] HUD: DÍA 18→21. Plaza con diez jóvenes ricos; después, un camino de campo con colinas y cipreses. El color vuelve de a poco.*\n\nDía dieciocho. En la plaza, unos chicos ricos hablan bajito.\nSon diez. Se van al campo, a una villa en las colinas. Van a pasar los días contando cuentos.\n⚑ Le queda una vida a Pijama. Va por el día dieciocho de treinta.\nEsto no es inventado. Un escritor de esta misma ciudad, Boccaccio, lo usó para su libro más famoso: el Decamerón.\nDiez jóvenes. Diez días. Cien cuentos. Mientras Florencia se moría.\n✂ 🕰 «Básicamente, el primer grupo de amigos que se fue de vacaciones en una pandemia.»\n{DECISIÓN 4}\n**Tarjeta: A) Quedarte en la ciudad · B) Seguirlos al campo**\nA: te quedas en tu establo, que ya conoces. B: los sigues al campo, sin saber si te van a dejar entrar. Elige.\n🕰 «Tres. Dos. Uno.»\nHuir era lo que hacía el que podía. Y era lo que mejor funcionaba: menos gente, menos ratas, menos pulgas.\nPijama los sigue. Descalzo. Por el camino. Treinta kilómetros de colinas, olivos y cipreses.\nDía veinte. Se cruzan con algo raro.\nUna fila de hombres sin camisa que se golpean la espalda con látigos. Cantan. Rezan. Van de pueblo en pueblo.\nSon los flagelantes. Creen que si sufren lo suficiente, Dios va a parar la peste.\nPero con ellos, de pueblo en pueblo… viaja la peste.\n🕰 «Bro. No te sumes a la fila.»\nPijama se esconde detrás de un ciprés hasta que pasan. {INF 40 %}\n\n---\n\n### DÍAS 22–27 · LA VILLA\n*[SHORT 6] HUD: DÍA 22→27. Villa toscana soleada, mesa larga con comida, jardín. Mucho color; después, sombra cuando tose el criado.*\n\nDía veintidós. Llegas a la villa. Te dejan pasar porque creen que el pijama es de seda.\n🕰 «Primera vez en tres videos que el pijama sirve para algo. Aura: más quinientos.» {AURA +500}\n⚑ Pijama huyó al campo. Le queda una vida. Va por el día veintidós.\nPan blanco. Aire limpio. Agua de pozo. Y diez chicos contando cuentos todo el día.\n✂ Los cuentos son de amor, de engaños y de bromas pesadas. Algunos son tan picantes que la Iglesia los prohibió durante siglos.\n🕰 «No los vamos a leer. Tenemos anunciantes.»\nDía veinticinco. Uno de los criados tose.\nLa villa entera se queda callada. {INF 55 %}\nY llega la última decisión. {DECISIÓN 5}\n**Tarjeta: A) Quedarte en la villa con los demás · B) Irte solo a una choza del bosque hasta el día treinta**\nA: te quedas en la villa, con comida y con gente. B: te vas solo a una choza del bosque, hasta el día treinta. Elige.\n🕰 «Tres. Dos. Uno.»\nPijama se va. Solo. Con pan, vinagre y su pijama de seda.\nY acá viene el dato que te vuela la cabeza.\nTreinta años después, en 1377, la ciudad de Ragusa, en la costa de Croacia, inventó una regla nueva.\nEl que llegaba de un lugar con peste tenía que esperar aislado treinta días antes de entrar.\nLo llamaron \"trentino\". Treinta días.\nDespués lo subieron a cuarenta. Y en italiano, cuarenta se dice \"quaranta\".\nDe ahí viene la palabra cuarentena.\n🕰 «O sea que este juego… era una cuarentena. Te engañé. De nada.»\n\n---\n\n### DÍAS 28–30 · EL FINAL\n*[SHORT 7] HUD: DÍA 28→30. Choza en el bosque, amanecer. Contador gigante al centro en el último día.*\n\nDía veintiocho. {INF 20 %}\nDía veintinueve. {INF 10 %}\n⚑ Pijama está solo en una choza del bosque. Le falta un día para el treinta.\nDía treinta. {el contador explota en 30/30}\nAbres la puerta. Sale el sol. Sigues vivo.\nTreinta días. Una vida. Una pulga. Y cero bultos.\n🕰 «Logro desbloqueado: sobrevivir treinta días a la peste negra. En pijama.»\n🕰 «Aura: más mil trescientos cuarenta y ocho.» {AURA +1348}\nY ahora el giro.\nMurió tanta gente que faltaban manos para trabajar. Los que quedaron empezaron a pedir más sueldo.\nEn algunos lugares, el sueldo de un trabajador casi se duplicó.\n🕰 «Sobreviviste y te subieron el sueldo. Mejor final imposible.»\n\n---\n\n### RESULTADOS Y CIERRE\n*[SHORT 8] Tabla con las 5 decisiones, que se completa con ✓ una por una.*\n\nTus resultados.\nEstablo, no posada. Pan en la puerta, sin entrar. Vinagre, no sangría. Huir al campo. Irte solo.\nCinco de cinco.\n¿Cuántas acertaste tú? Escríbelo en los comentarios: cinco de cinco… o te comió la pulga.\nY elige la próxima partida: día uno al treinta en la Roma de los gladiadores, en la Edad de Hielo… o en un barco pirata.\n🕰 «La más votada es la próxima. Y no: todavía no puedes apagarme.»\n\n---\n\n## D. MAPA DE SHORTS (9: tráiler + 8)\n\n| Short | Tramo | Gancho propio (línea 1) | Cierre (cliffhanger) |\n|---|---|---|---|\n| 0 | Tráiler | \"Florencia. Abril de 1348. Día uno.\" | \"Treinta días. Empieza… ya.\" |\n| 1 | Días 1–3 | \"Tu primer enemigo no es la peste. Es el hambre.\" | Decisión 1 resuelta: \"Huele a caballo, pero buena.\" |\n| 2 | Días 4–7 | \"Un vecino de la calle no abre la ventana.\" | \"Ya no es un vecino. Es la calle entera.\" |\n| 3 | Días 8–11 | \"Te pica la pierna. Te pica mucho.\" | \"Pierdes una vida…\" |\n| 4 | Días 12–17 | \"Las campanas dejaron de sonar.\" | \"Te queda una vida. Una.\" |\n| 5 | Días 18–21 | \"Diez chicos ricos se van al campo a contar cuentos.\" | Flagelantes: \"No te sumes a la fila.\" |\n| 6 | Días 22–27 | \"Te dejan pasar porque creen que el pijama es de seda.\" | \"De ahí viene la palabra cuarentena.\" |\n| 7 | Días 28–30 | \"Día veintiocho.\" | \"Te subieron el sueldo.\" |\n| 8 | Resultados | \"Cinco decisiones. ¿Cuántas acertaste?\" | \"Elige la próxima partida.\" |\n\nCada Short: la línea ⚑ de contexto va después del gancho; las líneas ✂ se sacan; arriba van el contador de días y las vidas; abajo, subtítulos palabra por palabra con color por tipo de palabra (rojo: peste, muerte, fiebre, pulga; amarillo: día, horas, número). La tarjeta final dice \"PARTE N · EL VIDEO COMPLETO ESTÁ EN MI CANAL\".\n\n---\n\n## E. DATOS Y SALVEDADES (lista privada; no va en la voz)\n\n- **Florencia en 1348:** se calculan unos 100.000 a 120.000 habitantes antes de la peste. Las estimaciones de muertos van de un 45 % a un 60 %; \"más o menos la mitad\" queda dentro del rango.\n- **Sicilia, Pisa:** la peste llegó a Messina en octubre de 1347 en barcos genoveses; a Pisa a principios de 1348; Florencia, de marzo a septiembre de 1348.\n- **Síntomas y tiempos:** la bubónica mata en unos 3 a 7 días a la mayoría de los que no reciben tratamiento; la neumónica, en 1 a 3 días, y se contagia por el aire. Es la descripción médica actual, no lo que sabían entonces.\n- **Pulgas y ratas:** la transmisión por pulgas de rata es la explicación clásica. Hoy también se le da peso a las pulgas y piojos humanos. La voz dice \"en las ratas, en la ropa\": cubre las dos.\n- **Germen:** el bacilo se identificó en 1894 (Yersin). \"Más de quinientos años\" es correcto.\n- **Máscara de pájaro:** se atribuye a Charles de Lorme, en el siglo XVII (alrededor de 1619–1630). En 1348 no existía. La voz dice \"en trescientos años\": aproximado.\n- **Saturno, Júpiter y Marte:** el informe de la Facultad de Medicina de París (octubre de 1348) culpó a una conjunción de esos planetas en 1345, más el aire corrompido.\n- **El papa y las hogueras:** Clemente VI, en Aviñón, por consejo de su médico Guy de Chauliac. Que el calor alejara a las pulgas es una explicación moderna posible, no un hecho probado: la voz dice \"de casualidad\".\n- **Campanas prohibidas:** en varias ciudades italianas se limitó o prohibió tocar campanas por los muertos (Florencia y otras). Va como hecho general.\n- **Agnolo di Tura:** cronista de Siena. Escribió que enterró a sus cinco hijos con sus propias manos. Es una cita conocida.\n- **Boccaccio y el Decamerón:** 10 jóvenes (7 mujeres y 3 hombres), 10 días de cuentos, 100 cuentos. La voz dice \"diez chicos ricos\" y \"diez jóvenes\": está bien. La Iglesia lo prohibió o censuró durante siglos (estuvo en el Índice).\n- **Flagelantes:** el gran movimiento de 1348–49 fue sobre todo en Alemania y los Países Bajos. En Italia hubo menos. Es una licencia de guion (el usuario dijo \"los datos dan igual\"), pero se puede cambiar a \"te cruzas con un grupo que viene del norte\".\n- **Ragusa (Dubrovnik), 1377:** el \"trentino\" de 30 días es correcto. La extensión a 40 días (quarantino) llegó después, en Venecia y otros puertos. \"Treinta años después\" es aproximado: fueron 29.\n- **Sueldos:** después de la peste los salarios subieron mucho por falta de trabajadores. En Inglaterra hubo leyes para frenarlos (Ordenanza de los Trabajadores, 1349). \"En algunos lugares casi se duplicó\" es una forma prudente de decirlo.\n- **Los tiempos de Pijama son simulación del juego:** se aclara en pantalla con un cartel chico al principio, como en el video 2.\n- **Naranja con clavos de olor (pomo):** en la Edad Media se usaban bolas de perfume (\"pomanders\"); la naranja con clavos es una versión algo posterior. Es una licencia de guion.\n";
